<!-- =====================================================================
     H3X0S3 — ULTIMATE REDESIGN THEME
     Minimalist Dark + Glassmorphism + Kali Linux custom cursor
     Single self-contained include: fonts, CSS, cursor JS.
     ===================================================================== -->

<!-- Fonts: Inter (body) + JetBrains Mono (headings/code) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:        #0a0a0f;
    --bg-soft:   #0d1117;
    --card:      #161b22;
    --card-2:    #1c2230;
    --border:    #21262d;
    --text:      #c9d1d9;
    --text-dim:  #8b949e;
    --accent:    #00ff9c;   /* Kali green */
    --accent-2:  #58a6ff;   /* dev blue */
    --accent-3:  #bc8cff;
    --danger:    #ff7b72;
    --radius:    14px;
    --maxw:      860px;
    --font-body: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --glass:     rgba(13, 17, 23, 0.72);
  }

  /* ---------- Reset ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: clamp(15px, 1vw + 0.8rem, 18px);
    line-height: 1.7;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Subtle grid glow background */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(1100px 600px at 12% -10%, rgba(0,255,156,0.10), transparent 60%),
      radial-gradient(1000px 600px at 100% 0%, rgba(88,166,255,0.10), transparent 55%),
      linear-gradient(transparent 0 96%, rgba(255,255,255,0.022) 96%) 0 0 / 100% 38px;
    pointer-events: none; z-index: 0;
  }

  /* ---------- Typography ---------- */
  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-mono);
    color: #e6edf3;
    line-height: 1.25;
    letter-spacing: -0.01em;
    margin: 1.6em 0 0.6em;
  }
  h1 { font-size: clamp(1.8rem, 1vw + 1.6rem, 2.8rem); }
  h2 { font-size: clamp(1.4rem, 1vw + 1.1rem, 2rem); }
  h3 { font-size: clamp(1.15rem, 0.8vw + 0.9rem, 1.5rem); }
  h1::before, h2::before { content: ""; }
  a { color: var(--accent-2); text-decoration: none; transition: color .3s ease, opacity .3s ease; }
  a:hover { color: var(--accent); }
  p { margin: 0 0 1rem; }
  ::selection { background: rgba(0,255,156,0.28); color: #fff; }

  /* ---------- Layout shell ---------- */
  .content {
    position: relative; z-index: 1;
    width: 100%; max-width: var(--maxw);
    margin: 0 auto;
    padding: clamp(1.2rem, 3vw, 3rem) clamp(1rem, 4vw, 2rem);
  }

  /* ---------- Header (glass) ---------- */
  .bar-header {
    position: sticky; top: 0; z-index: 1000;
    display: flex; align-items: center; gap: 1rem;
    padding: 0.7rem clamp(1rem, 4vw, 2rem);
    background: var(--glass);
    backdrop-filter: saturate(160%) blur(14px);
    -webkit-backdrop-filter: saturate(160%) blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .bar-header .logo a {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: clamp(1.1rem, 1vw + 0.9rem, 1.45rem);
    color: var(--accent);
    text-shadow: 0 0 18px rgba(0,255,156,0.45);
  }
  .bar-header .logo a::after { content: "_"; opacity: 0.7; }
  .bar-header #menu, .bar-header #search {
    color: var(--text-dim);
    display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    transition: all .3s ease;
    cursor: pointer;
  }
  .bar-header #menu:hover, .bar-header #search:hover {
    color: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 16px rgba(0,255,156,0.25);
  }
  .bar-header .icon-menu, .bar-header .icon-search { width: 18px; height: 18px; fill: currentColor; }

  /* ---------- Cards / post lists ---------- */
  .card, .post-card, .recommendation, article.post-list-item {
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: clamp(1rem, 2vw, 1.5rem);
    transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .card:hover, .post-card:hover {
    transform: translateY(-3px);
    border-color: rgba(0,255,156,0.35);
    box-shadow: 0 10px 30px -12px rgba(0,255,156,0.18);
  }
  .grid, .posts, .post-list {
    display: grid;
    gap: clamp(1rem, 2vw, 1.5rem);
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
  }

  /* ---------- Post content ---------- */
  .content img, .post-content img, article img {
    max-width: 100%;
    height: auto;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    padding: 4px;
    display: block;
    margin: 1.2rem auto;
    box-shadow: 0 12px 34px -16px rgba(0,0,0,0.8);
  }

  /* Code blocks + inline code */
  code, pre, .highlight, .highlighter-rouge {
    font-family: var(--font-mono);
    font-size: 0.92em;
  }
  :not(pre) > code {
    background: rgba(0,255,156,0.10);
    color: var(--accent);
    padding: 0.15em 0.4em;
    border-radius: 6px;
    border: 1px solid rgba(0,255,156,0.18);
  }
  pre, .highlight {
    background: var(--bg-soft) !important;
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    overflow-x: auto;
    line-height: 1.55;
  }
  pre code { background: transparent; color: var(--text); padding: 0; border: 0; }
  .highlight .c { color: var(--text-dim); } /* comment tweak */

  blockquote {
    margin: 1.2rem 0;
    padding: 0.6rem 1.1rem;
    border-left: 3px solid var(--accent-2);
    background: rgba(88,166,255,0.06);
    border-radius: 0 10px 10px 0;
    color: var(--text-dim);
  }
  hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }

  table { width: 100%; border-collapse: collapse; margin: 1.2rem 0; font-size: 0.92em; }
  th, td { border: 1px solid var(--border); padding: 0.55rem 0.75rem; text-align: left; }
  th { background: var(--card); color: #e6edf3; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  ul, ol { padding-left: 1.3rem; }
  li { margin: 0.3rem 0; }

  /* ---------- Buttons / tags ---------- */
  a.button, .btn, button {
    font-family: var(--font-mono);
    background: rgba(0,255,156,0.08);
    color: var(--accent);
    border: 1px solid rgba(0,255,156,0.3);
    border-radius: 10px;
    padding: 0.55rem 0.95rem;
    transition: all .3s ease;
  }
  a.button:hover, .btn:hover { background: rgba(0,255,156,0.18); box-shadow: 0 0 18px rgba(0,255,156,0.22); }

  /* ---------- Footer ---------- */
  footer, .footer {
    position: relative; z-index: 1;
    border-top: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text-dim);
    padding: 2rem clamp(1rem, 4vw, 2rem);
    text-align: center;
    font-size: 0.88rem;
  }
  footer a { color: var(--text-dim); } footer a:hover { color: var(--accent); }

  /* ---------- Misc UI from old theme ---------- */
  .overlay, #mask { background: rgba(0,0,0,0.55) !important; backdrop-filter: blur(3px); }
  .pushy, .search-container { background: var(--card) !important; border-left: 1px solid var(--border); }
  .pushy a, .search-container a { color: var(--text); transition: color .3s ease, padding-left .3s ease; }
  .pushy a:hover { color: var(--accent); padding-left: 6px; }

  /* ---------- Scrollbar ---------- */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #2a313c; border-radius: 8px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* ---------- 404 / hero ---------- */
  .hero, .page-hero { text-align: center; padding: clamp(2rem, 6vw, 4rem) 0; }
  .hero h1 { font-size: clamp(2rem, 2vw + 2rem, 3.4rem); margin-top: 0; }

  /* =====================================================================
     KALI LINUX CUSTOM CURSOR  (desktop hover devices only)
     ===================================================================== */
  #kali-cursor, #kali-cursor-trail {
    position: fixed;
    top: 0; left: 0;
    z-index: 999999;
    pointer-events: none;
    will-change: transform;
    display: none;
  }
  #kali-cursor {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 18px;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 10px rgba(0,255,156,0.9), 0 0 22px rgba(0,255,156,0.4);
    mix-blend-mode: screen;
    transform: translate(-50%, -50%);
  }
  #kali-cursor::before { content: "\2588"; }            /* terminal block █ */
  #kali-cursor .dragon {
    font-size: 20px;
    margin-left: 4px;
    filter: drop-shadow(0 0 8px rgba(0,255,156,0.6));
  }
  #kali-cursor .dragon::before { content: "\1F409"; }   /* 🐉 Kali dragon */
  #kali-cursor-trail {
    width: 34px; height: 34px;
    border: 1px solid rgba(0,255,156,0.5);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 18px rgba(0,255,156,0.18) inset;
    transition: width .25s ease, height .25s ease, border-color .25s ease;
  }
  #kali-cursor-trail.is-link { width: 52px; height: 52px; border-color: var(--accent-2); }

  /* Desktop with precise hover: hide native cursor, show Kali cursor */
  @media (hover: hover) and (pointer: fine) {
    html, body, * { cursor: none !important; }
    #kali-cursor, #kali-cursor-trail { display: block; }
  }
  /* Touch / no-hover: ensure native cursor and hide custom */
  @media (hover: none), (pointer: coarse) {
    html, body, * { cursor: auto !important; }
    #kali-cursor, #kali-cursor-trail { display: none !important; }
  }

  /* Reduced motion respect */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; animation: none !important; }
    #kali-cursor, #kali-cursor-trail { display: none !important; }
    html, body, * { cursor: auto !important; }
  }

  /* Responsive guard */
  img, video, iframe, table, pre { max-width: 100%; }
  body { overflow-x: hidden; }
</style>

<script>
  (function () {
    // Only build cursor on hover-capable, precise-pointer devices.
    var canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    var reduced  = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!canHover || reduced) return;

    var dot   = document.createElement('div');
    dot.id    = 'kali-cursor';
    var dragon = document.createElement('span');
    dragon.className = 'dragon';
    dot.appendChild(dragon);

    var ring  = document.createElement('div');
    ring.id   = 'kali-cursor-trail';

    // append ASAP (body may not exist yet)
    function mount() { document.body.appendChild(dot); document.body.appendChild(ring); }
    if (document.body) mount();
    else document.addEventListener('DOMContentLoaded', mount);

    var mx = window.innerWidth / 2, my = window.innerHeight / 2;
    var dx = mx, dy = my;          // dot position (fast follow)
    var rx = mx, ry = my;          // ring position (lerp, slower)

    window.addEventListener('mousemove', function (e) {
      mx = e.clientX; my = e.clientY;
    }, { passive: true });

    // Grow trail when hovering interactive elements
    document.addEventListener('mouseover', function (e) {
      var t = e.target;
      var interactive = t.closest && t.closest('a, button, input, textarea, select, [role="button"], .card, .post-card');
      ring.classList.toggle('is-link', !!interactive);
    });

    function tick() {
      // dot follows quickly with tiny easing
      dx += (mx - dx) * 0.35;
      dy += (my - dy) * 0.35;
      // ring follows with smoother lerp (delayed)
      rx += (mx - rx) * 0.18;
      ry += (my - ry) * 0.18;
      dot.style.transform  = 'translate(' + dx + 'px,' + dy + 'px) translate(-50%,-50%)';
      ring.style.transform = 'translate(' + rx + 'px,' + ry + 'px) translate(-50%,-50%)';
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // Hide if pointer leaves the window
    document.addEventListener('mouseleave', function () {
      dot.style.opacity = '0'; ring.style.opacity = '0';
    });
    document.addEventListener('mouseenter', function () {
      dot.style.opacity = '1'; ring.style.opacity = '1';
    });
  })();
</script>

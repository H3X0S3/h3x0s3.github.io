# Hexo Configuration for H3X0S3 (migrated from Jekyll + Jekflix)
# Docs: https://hexo.io/docs/configuration.html

# Site
title: H3X0S3
subtitle: 'InfoSec Blog'
description: 'an information security blog covering HackTheBox, TryHackMe, web application security, and CTFs by Mahmoud Salah.'
keywords: 'hackthebox,tryhackme,web security,CTFs,infosec'
author: Mahmoud Salah
language: en
timezone: ''

# URL
url: https://h3x0s3.github.io/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata
meta_generator: true

# Date / Time
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude
include:
exclude:
ignore:

# Extensions
theme: fluid

# Deployment
deploy:
  type: ''

search:
  path: search.xml
  field: post
  format: html
  limit: 10000
